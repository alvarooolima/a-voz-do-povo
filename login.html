<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — A Voz do Povo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%231557A6%22/><text x=%2250%22 y=%2266%22 font-size=%2258%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22>V</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body">

<div class="auth-shell">
  <main class="auth-main">
    <div class="auth-card">

      <a class="brand auth-logo" href="index.html">
        <span class="brand-name">A Voz do Povo</span>
      </a>

      <div class="auth-tabs" role="tablist">
        <button class="auth-tab is-active" id="tabLogin" role="tab" aria-selected="true">Entrar</button>
        <button class="auth-tab" id="tabRegister" role="tab" aria-selected="false">Criar conta</button>
      </div>

      <!-- LOGIN -->
      <form class="auth-form" id="loginForm" novalidate>
        <div class="field">
          <label for="loginEmail">E-mail</label>
          <input type="email" id="loginEmail" name="email" placeholder="voce@exemplo.com" required autocomplete="email">
        </div>

        <div class="field">
          <label for="loginSenha">Senha</label>
          <div class="pw-wrap">
            <input type="password" id="loginSenha" name="senha" placeholder="Sua senha" required autocomplete="current-password" minlength="6">
            <button type="button" class="pw-toggle" data-target="loginSenha" aria-label="Mostrar senha">👁</button>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="loginCpf">CPF ou CNPJ</label>
            <input type="text" id="loginCpf" name="cpf" placeholder="CPF ou CNPJ" inputmode="numeric" maxlength="18" required>
          </div>
          <div class="field">
            <label for="loginTelefone">Telefone</label>
            <input type="text" id="loginTelefone" name="telefone" placeholder="(00) 00000-0000" inputmode="numeric" maxlength="15" required>
          </div>
        </div>

        <div class="field-inline">
          <label class="checkbox">
            <input type="checkbox" id="manterConectado">
            <span>Manter conectado</span>
          </label>
          <button type="button" class="link-btn" id="forgotLink">Esqueci minha senha</button>
        </div>

        <button type="submit" class="btn btn-primary btn-lg btn-block">Entrar</button>
        <p class="form-msg" id="loginMsg" role="status" aria-live="polite"></p>

        <p class="auth-switch">Não tem conta? <button type="button" class="link-btn" id="goRegister">Cadastre-se</button></p>
      </form>

      <!-- ESQUECI A SENHA -->
      <div class="auth-panel" id="forgotPanel" hidden>
        <button type="button" class="link-btn back-btn" id="forgotBack">← Voltar para o login</button>
        <h2>Recuperar senha</h2>
        <p class="muted">Informe o e-mail cadastrado. Vamos enviar um link para você criar uma nova senha.</p>
        <form id="forgotForm" novalidate>
          <div class="field">
            <label for="forgotEmail">E-mail</label>
            <input type="email" id="forgotEmail" name="email" placeholder="voce@exemplo.com" required>
          </div>
          <button type="submit" class="btn btn-primary btn-lg btn-block">Enviar link de recuperação</button>
          <p class="form-msg" id="forgotMsg" role="status" aria-live="polite"></p>
        </form>
      </div>

      <!-- CADASTRO -->
      <form class="auth-form" id="registerForm" novalidate hidden>
        <div class="field">
          <label>Tipo de conta</label>
          <div class="account-type" id="accountType" role="radiogroup" aria-label="Tipo de conta">
            <button type="button" class="type-btn is-active" data-type="cidadao" role="radio" aria-checked="true">Cidadão</button>
            <button type="button" class="type-btn" data-type="prefeitura" role="radio" aria-checked="false">Prefeitura</button>
            <button type="button" class="type-btn" data-type="prefeito" role="radio" aria-checked="false">Prefeito</button>
          </div>
          <input type="hidden" id="regTipo" value="cidadao">
          <p class="type-hint" id="typeHint"></p>
        </div>

        <div class="field">
          <label for="regNome">Nome completo</label>
          <input type="text" id="regNome" name="nome" placeholder="Seu nome completo" required autocomplete="name">
        </div>

        <div class="field" id="partidoField" hidden>
          <label for="regPartido">Partido (sigla e nome)</label>
          <input type="text" id="regPartido" name="partido" placeholder="Ex.: PPM — Partido Progressista Municipal">
        </div>

        <div class="field">
          <label for="regEmail">E-mail</label>
          <input type="email" id="regEmail" name="email" placeholder="voce@exemplo.com" required autocomplete="email">
        </div>

        <div class="field-row">
          <div class="field">
            <label for="regSenha">Senha</label>
            <input type="password" id="regSenha" name="senha" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password">
          </div>
          <div class="field">
            <label for="regSenha2">Confirmar senha</label>
            <input type="password" id="regSenha2" name="senha2" placeholder="Repita a senha" required minlength="6" autocomplete="new-password">
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="regCpf" id="regCpfLabel">CPF</label>
            <input type="text" id="regCpf" name="cpf" placeholder="000.000.000-00" inputmode="numeric" maxlength="14" required>
          </div>
          <div class="field">
            <label for="regTelefone">Telefone</label>
            <input type="text" id="regTelefone" name="telefone" placeholder="(00) 00000-0000" inputmode="numeric" maxlength="15" required>
          </div>
        </div>

        <label class="checkbox terms-check">
          <input type="checkbox" id="regTermos" required>
          <span>Li e concordo com os termos de uso e a política de privacidade</span>
        </label>

        <button type="submit" class="btn btn-primary btn-lg btn-block">Criar conta</button>
        <p class="form-msg" id="registerMsg" role="status" aria-live="polite"></p>

        <p class="auth-switch">Já tem conta? <button type="button" class="link-btn" id="goLogin">Entrar</button></p>
      </form>

    </div>
  </main>
</div>

<script src="auth.js"></script>
</body>
</html>
